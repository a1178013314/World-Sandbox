<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>腿账 LegLedger · 移动端</title>
<style>
  :root {
    --bg: #edefe8;
    --surface: #f7f8f3;
    --ink: #14201b;
    --ink-2: #59655e;
    --hair: rgba(20, 32, 27, 0.14);
    --hair-soft: rgba(20, 32, 27, 0.08);

    --ok: #2f7a52;
    --warn: #9a6b14;
    --bad: #b23a24;

    --accent: #14201b;
    --on-accent: #f2f4ee;

    --desk: #dfe3d9;
    --shell: #171d1a;

    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1311;
      --surface: #151d1a;
      --ink: #e6eae2;
      --ink-2: #98a49c;
      --hair: rgba(230, 234, 226, 0.16);
      --hair-soft: rgba(230, 234, 226, 0.08);

      --ok: #71c08f;
      --warn: #e0ae4e;
      --bad: #e8776a;

      --accent: #e6eae2;
      --on-accent: #0d1311;

      --desk: #070a09;
      --shell: #202824;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; }

  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: var(--desk);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 12px 16px;
  }

  h1, h2, p, dl, dd, dt, ul { margin: 0; }
  ul { padding: 0; list-style: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  .mono {
    font-family: "SF Mono", "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* Device shell */
  .device {
    width: 390px;
    height: 844px;
    padding: 10px;
    border-radius: 54px;
    background: var(--shell);
    box-shadow: 0 34px 90px rgba(12, 22, 17, 0.32), 0 2px 0 rgba(255, 255, 255, 0.12) inset;
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  /* App header */
  .app-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 22px 6px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    letter-spacing: 0.01em;
  }
  .brand-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    position: relative;
    flex: none;
  }
  .brand-dot::after {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: var(--ink);
  }
  .brand b { font-weight: 600; }
  .trip {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-2);
  }

  /* Day switch */
  .day-switch {
    flex: none;
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 14px 0 4px;
  }
  .day-dot {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--hair);
    color: var(--ink-2);
    font-size: 14px;
    display: grid;
    place-items: center;
    transition: background 0.3s var(--ease), color 0.3s var(--ease),
                border-color 0.3s var(--ease), transform 0.2s var(--ease);
  }
  .day-dot:hover { border-color: var(--ink-2); }
  .day-dot:active { transform: scale(0.94); }
  .day-dot[aria-selected="true"] {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
  }

  /* Main dial */
  .dial-wrap {
    flex: none;
    display: grid;
    place-items: center;
    padding: 10px 0 4px;
  }
  .dial[data-state="ok"] { --ring: var(--ok); }
  .dial[data-state="warn"] { --ring: var(--warn); }
  .dial[data-state="bad"] { --ring: var(--bad); }

  .dial {
    position: relative;
    width: 252px;
    height: 252px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--hair-soft);
  }
  .dial svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .dial circle { fill: none; }
  .dial .track { stroke: var(--hair); stroke-width: 7; }
  .dial .fill {
    stroke: var(--ring, var(--ink));
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 741.4;
    stroke-dashoffset: calc(741.4 - 741.4 * var(--pct, 0));
    transition: stroke-dashoffset 1s var(--ease), stroke 0.5s var(--ease);
  }
  .dial-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .dial-num {
    font-size: 78px;
    line-height: 0.95;
    letter-spacing: -0.05em;
    font-weight: 500;
  }
  .dial-state {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  /* Verdict */
  .verdict {
    flex: none;
    padding: 14px 26px 0;
    text-align: center;
  }
  .verdict-name {
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink-2);
  }
  .verdict-text {
    margin-top: 8px;
    font-size: 16px;
    line-height: 1.55;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  /* Metrics */
  .metrics {
    flex: none;
    margin: 10px 22px 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    text-align: center;
  }
  .metrics div {
    padding: 12px 4px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--hair-soft);
  }
  .metrics dt {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--ink-2);
    text-transform: uppercase;
  }
  .metrics dd {
    margin: 4px 0 0;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  /* People rail */
  .rail-head {
    flex: none;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 24px 10px;
  }
  .rail-head h2 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .rail-head span {
    font-size: 11.5px;
    color: var(--ink-2);
  }

  .people-rail {
    flex: none;
    display: flex;
    gap: 10px;
    padding: 0 24px 6px;
    overflow-x: auto;
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
  }
  .people-rail::-webkit-scrollbar { display: none; }

  .person {
    flex: none;
    width: 66px;
    scroll-snap-align: start;
    text-align: center;
  }
  .person-bubble {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    border: 1px solid var(--hair-soft);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
  }
  .person-bubble .age { font-size: 9.5px; letter-spacing: 0.06em; color: var(--ink-2); }
  .person-bubble .score { font-size: 19px; line-height: 1; letter-spacing: -0.02em; }
  .person-name {
    margin-top: 7px;
    font-size: 11px;
    color: var(--ink-2);
    letter-spacing: 0.02em;
  }

  /* Spacer pushes CTA down */
  .grow { flex: 1 1 auto; min-height: 4px; }

  /* CTA */
  .cta-bar {
    flex: none;
    padding: 8px 22px 10px;
  }
  .primary {
    width: 100%;
    height: 54px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 15.5px;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s var(--ease), opacity 0.2s var(--ease);
  }
  .primary:active { transform: scale(0.985); }
  .primary[disabled] { opacity: 0.4; }
  .cta-note {
    margin-top: 9px;
    text-align: center;
    font-size: 11px;
    color: var(--ink-2);
    letter-spacing: 0.02em;
  }

  /* Tab bar */
  .tabbar {
    flex: none;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--hair-soft);
    background: var(--bg);
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    color: var(--ink-2);
    letter-spacing: 0.04em;
  }
  .tab-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--hair);
    display: grid;
    place-items: center;
    transition: background 0.25s var(--ease), border-color 0.25s var(--ease);
  }
  .tab-dot::after {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.55;
  }
  .tab[aria-current="page"] { color: var(--ink); }
  .tab[aria-current="page"] .tab-dot {
    background: var(--accent);
    border-color: var(--accent);
  }
  .tab[aria-current="page"] .tab-dot::after {
    background: var(--on-accent);
    opacity: 1;
  }

  /* Desktop hint */
  .hint {
    margin-top: 12px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ink-2);
    opacity: 0.7;
  }

  /* Mobile: fill the viewport */
  @media (max-width: 520px) {
    body { display: block; padding: 0; }
    .device {
      width: 100vw;
      height: 100dvh;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      background: var(--bg);
    }
    .screen { border-radius: 0; height: 100dvh; }
    .hint { display: none; }
    .dial { width: min(252px, 66vw); height: min(252px, 66vw); }
    .dial-num { font-size: min(78px, 20vw); }
  }

  @media (max-height: 760px) and (max-width: 520px) {
    .dial { width: min(226px, 60vw); height: min(226px, 60vw); }
    .dial-num { font-size: 66px; }
    .people-rail { padding-bottom: 2px; }
    .verdict { padding-top: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dial .fill, .day-dot, .primary, .tab-dot { transition: none; }
  }
</style>
</head>
<body>

<div class="device">
  <div class="screen">

    <header class="app-head">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <b>腿账</b>
      </div>
      <span class="trip">重庆 3 日</span>
    </header>

    <div class="day-switch" role="tablist" aria-label="选择第几天">
      <button class="day-dot" type="button" role="tab" data-day="0" aria-selected="false" aria-label="第 1 天">1</button>
      <button class="day-dot" type="button" role="tab" data-day="1" aria-selected="false" aria-label="第 2 天">2</button>
      <button class="day-dot" type="button" role="tab" data-day="2" aria-selected="true" aria-label="第 3 天">3</button>
    </div>

    <div class="dial-wrap">
      <div class="dial" id="dial" data-state="bad" style="--pct: 0.92">
        <svg viewBox="0 0 260 260" aria-hidden="true">
          <circle class="track" cx="130" cy="130" r="118"></circle>
          <circle class="fill" cx="130" cy="130" r="118"></circle>
        </svg>
        <div class="dial-center">
          <span class="dial-num mono" id="dialNum">138</span>
          <span class="dial-state" id="dialState">崩溃</span>
        </div>
      </div>
    </div>

    <div class="verdict">
      <p class="verdict-name" id="dayName">Day 3 · 南山到鹅岭</p>
      <p class="verdict-text" id="verdictText">这天走不完。不是意志问题，是膝盖问题。</p>
    </div>

    <dl class="metrics">
      <div><dt>步数</dt><dd class="mono" id="mSteps">22,000</dd></div>
      <div><dt>爬升</dt><dd class="mono" id="mClimb">780 m</dd></div>
      <div><dt>在外</dt><dd class="mono" id="mHours">12.5 h</dd></div>
    </dl>

    <div class="rail-head">
      <h2>同行人</h2>
      <span>同一条路，四种腿</span>
    </div>
    <div class="people-rail">
      <div class="person">
        <div class="person-bubble"><span class="age mono">68 岁</span><span class="score mono">138</span></div>
        <p class="person-name">父亲</p>
      </div>
      <div class="person">
        <div class="person-bubble"><span class="age mono">65 岁</span><span class="score mono">138</span></div>
        <p class="person-name">母亲</p>
      </div>
      <div class="person">
        <div class="person-bubble"><span class="age mono">7 岁</span><span class="score mono">116</span></div>
        <p class="person-name">孩子</p>
      </div>
      <div class="person">
        <div class="person-bubble"><span class="age mono">36 岁</span><span class="score mono">106</span></div>
        <p class="person-name">你</p>
      </div>
    </div>

    <div class="grow"></div>

    <div class="cta-bar">
      <button class="primary" id="reliefBtn" type="button">看减负方案</button>
      <p class="cta-note" id="ctaNote">砍 1 个点，换 2 段车，坐 1 次缆车</p>
    </div>

    <nav class="tabbar" aria-label="底部导航">
      <button class="tab" type="button" aria-current="page">
        <span class="tab-dot" aria-hidden="true"></span>账本
      </button>
      <button class="tab" type="button">
        <span class="tab-dot" aria-hidden="true"></span>行程
      </button>
      <button class="tab" type="button">
        <span class="tab-dot" aria-hidden="true"></span>同行人
      </button>
      <button class="tab" type="button">
        <span class="tab-dot" aria-hidden="true"></span>我的
      </button>
    </nav>

  </div>
</div>

<p class="hint">移动端界面 · 390 × 844</p>

<script>
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var days = [
    {
      day: 1,
      name: "Day 1 · 解放碑到洪崖洞",
      value: 52,
      state: "ok",
      stateText: "轻松",
      verdict: "这天可以再加一个点。",
      steps: "10,000",
      climb: "100 m",
      hours: "8 h"
    },
    {
      day: 2,
      name: "Day 2 · 磁器口到李子坝",
      value: 88,
      state: "warn",
      stateText: "偏紧",
      verdict: "能走完，但中间必须坐一次。",
      steps: "15,000",
      climb: "350 m",
      hours: "10.5 h"
    },
    {
      day: 3,
      name: "Day 3 · 南山到鹅岭",
      value: 138,
      state: "bad",
      stateText: "崩溃",
      verdict: "这天走不完。不是意志问题，是膝盖问题。",
      steps: "22,000",
      climb: "780 m",
      hours: "12.5 h"
    }
  ];

  var reduced = {
    name: "Day 3 · 南山到鹅岭（减负版）",
    value: 82,
    state: "warn",
    stateText: "偏紧",
    verdict: "能走完，但中间要坐一次。",
    steps: "15,000",
    climb: "250 m",
    hours: "11 h"
  };

  var dial = document.getElementById("dial");
  var dialNum = document.getElementById("dialNum");
  var dialState = document.getElementById("dialState");
  var dayName = document.getElementById("dayName");
  var verdictText = document.getElementById("verdictText");
  var mSteps = document.getElementById("mSteps");
  var mClimb = document.getElementById("mClimb");
  var mHours = document.getElementById("mHours");
  var reliefBtn = document.getElementById("reliefBtn");
  var ctaNote = document.getElementById("ctaNote");
  var dots = Array.prototype.slice.call(document.querySelectorAll(".day-dot"));

  var current = 2;
  var isReduced = false;

  function countTo(el, target, duration) {
    if (reduce) { el.textContent = String(target); return; }
    var start = performance.now();
    function tick(now) {
      var t = Math.min((now - start) / duration, 1);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = String(Math.round(target * eased));
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function render(data, animate) {
    dial.dataset.state = data.state;
    dial.style.setProperty("--pct", String(Math.min(data.value / 150, 1)));

    if (animate) {
      countTo(dialNum, data.value, 700);
    } else {
      dialNum.textContent = String(data.value);
    }

    dialState.textContent = data.stateText;
    dayName.textContent = data.name;
    verdictText.textContent = data.verdict;
    mSteps.textContent = data.steps;
    mClimb.textContent = data.climb;
    mHours.textContent = data.hours;
  }

  dots.forEach(function (dot) {
    dot.addEventListener("click", function () {
      var index = Number(dot.dataset.day);
      if (index === current) return;
      current = index;
      isReduced = false;
      dots.forEach(function (d) {
        d.setAttribute("aria-selected", d === dot ? "true" : "false");
      });
      render(days[index], true);
      reliefBtn.textContent = "看减负方案";
      reliefBtn.disabled = false;
      ctaNote.textContent = "砍 1 个点，换 2 段车，坐 1 次缆车";
    });
  });

  reliefBtn.addEventListener("click", function () {
    if (current !== 2) return;

    if (isReduced) {
      isReduced = false;
      render(days[2], true);
      reliefBtn.textContent = "看减负方案";
      ctaNote.textContent = "砍 1 个点，换 2 段车，坐 1 次缆车";
      return;
    }

    isReduced = true;
    render(reduced, true);
    reliefBtn.textContent = "还原原版";
    ctaNote.textContent = "同一条路，少走 7,000 步，少爬 530 米";
  });
})();
</script>

</body>
</html>
